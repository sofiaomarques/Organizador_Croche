<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Armarinho Virtual</title>
<link rel="stylesheet" href="tabler-icons.min.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --page: #f7f1ec;
    --surface: #fffdfb;
    --surface-soft: #fff5f1;
    --surface-muted: #f3e4dc;
    --text: #261719;
    --text-secondary: #766265;
    --text-tertiary: #a78c8e;
    --line: rgba(82, 45, 48, 0.12);
    --line-strong: rgba(82, 45, 48, 0.22);
    --accent: #b85b70;
    --accent-strong: #8d314c;
    --accent-soft: #fde6eb;
    --mint: #267a6b;
    --mint-soft: #e3f3ee;
    --gold: #9c681d;
    --gold-soft: #fff1d9;
    --blue: #416f99;
    --blue-soft: #e7f0f8;
    --green: #477225;
    --green-soft: #e9f4df;
    --red: #b33d44;
    --red-soft: #fde8e8;
    --shadow: 0 22px 60px rgba(83, 47, 45, 0.14);
    --shadow-soft: 0 12px 34px rgba(83, 47, 45, 0.09);
    --radius-sm: 8px;
    --radius-md: 10px;
    --radius-lg: 14px;
    --font: Inter, "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  }

  body {
    min-height: 100vh;
    font-family: var(--font);
    line-height: 1.5;
    color: var(--text);
    background:
      linear-gradient(135deg, rgba(184, 91, 112, 0.18) 0%, rgba(184, 91, 112, 0) 36%),
      linear-gradient(315deg, rgba(38, 122, 107, 0.12) 0%, rgba(38, 122, 107, 0) 34%),
      var(--page);
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.38;
    background-image:
      linear-gradient(90deg, rgba(141, 49, 76, 0.06) 1px, transparent 1px),
      linear-gradient(0deg, rgba(38, 122, 107, 0.05) 1px, transparent 1px);
    background-size: 44px 44px;
    mask-image: linear-gradient(to bottom, black 0%, transparent 72%);
  }

  button, input, select, textarea { font: inherit; }
  button, label, select { -webkit-tap-highlight-color: transparent; }

  .container {
    width: min(1120px, calc(100% - 32px));
    margin: 0 auto;
    padding: 28px 0 40px;
    position: relative;
  }

  .header {
    min-height: 168px;
    margin-bottom: 18px;
    padding: 22px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
    border: 1px solid rgba(255, 255, 255, 0.72);
    border-radius: var(--radius-lg);
    background:
      linear-gradient(135deg, rgba(255, 253, 251, 0.96), rgba(255, 246, 242, 0.88)),
      repeating-linear-gradient(135deg, rgba(184, 91, 112, 0.08) 0 1px, transparent 1px 13px);
    box-shadow: var(--shadow);
  }

  .brand-panel {
    display: flex;
    align-items: center;
    gap: 16px;
    min-width: 0;
  }

  .brand-icon {
    width: 64px;
    height: 64px;
    border-radius: 18px;
    display: grid;
    place-items: center;
    flex: 0 0 auto;
    color: var(--accent-strong);
    background:
      radial-gradient(circle at 30% 25%, #ffffff 0 18%, transparent 19%),
      linear-gradient(135deg, var(--accent-soft), #fff8ed);
    border: 1px solid rgba(184, 91, 112, 0.22);
    box-shadow: inset 0 -10px 18px rgba(184, 91, 112, 0.08);
  }

  .brand-icon i { font-size: 34px; }
  .eyebrow {
    margin-bottom: 2px;
    color: var(--accent-strong);
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .header h1 {
    color: var(--text);
    font-size: clamp(30px, 5vw, 48px);
    line-height: 1;
    font-weight: 850;
    letter-spacing: 0;
  }
  .header p {
    max-width: 560px;
    margin-top: 10px;
    color: var(--text-secondary);
    font-size: 15px;
  }

  .header-actions {
    display: flex;
    gap: 8px;
    align-items: center;
    justify-content: flex-end;
    flex-wrap: wrap;
    flex: 0 0 auto;
  }

  .storage-status {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--text-secondary);
    font-size: 12px;
    white-space: nowrap;
  }
  .storage-status i { color: var(--mint); font-size: 15px; }
  .storage-status.is-fallback i { color: var(--gold); }

  .summary-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 12px;
    margin-bottom: 18px;
  }

  .summary-card {
    min-height: 108px;
    padding: 16px;
    border-radius: var(--radius-lg);
    border: 1px solid rgba(255, 255, 255, 0.72);
    background: rgba(255, 253, 251, 0.82);
    box-shadow: var(--shadow-soft);
  }

  .summary-card span {
    display: flex;
    align-items: center;
    gap: 7px;
    color: var(--text-secondary);
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .summary-card strong {
    display: block;
    margin-top: 8px;
    color: var(--text);
    font-size: 32px;
    line-height: 1;
  }

  .summary-card small {
    display: block;
    margin-top: 8px;
    color: var(--text-tertiary);
    font-size: 13px;
  }

  .workspace-panel {
    padding: 18px;
    border-radius: var(--radius-lg);
    border: 1px solid rgba(255, 255, 255, 0.74);
    background: rgba(255, 253, 251, 0.74);
    box-shadow: var(--shadow);
    backdrop-filter: blur(14px);
  }

  .tabs {
    display: inline-flex;
    gap: 4px;
    margin-bottom: 16px;
    padding: 4px;
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    background: var(--surface-soft);
  }

  .tab {
    min-height: 38px;
    padding: 0 14px;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    border: 0;
    border-radius: var(--radius-sm);
    background: transparent;
    color: var(--text-secondary);
    cursor: pointer;
    font-size: 14px;
    font-weight: 700;
    transition: background 0.16s ease, color 0.16s ease, box-shadow 0.16s ease;
  }

  .tab.active {
    color: var(--accent-strong);
    background: var(--surface);
    box-shadow: 0 6px 18px rgba(83, 47, 45, 0.1);
  }

  .toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }

  .search-box {
    min-width: min(100%, 320px);
    flex: 1;
    position: relative;
    color: var(--text-tertiary);
  }

  .search-box i {
    position: absolute;
    left: 13px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 18px;
    pointer-events: none;
  }

  .search-box input { width: 100%; padding-left: 40px; }

  input[type=text], input[type=color], select, textarea {
    min-height: 42px;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius-md);
    background: var(--surface);
    color: var(--text);
    font-size: 14px;
    outline: none;
    transition: border-color 0.16s ease, box-shadow 0.16s ease, background 0.16s ease;
  }

  input[type=text], select, textarea { padding: 9px 12px; }
  input[type=text]::placeholder, textarea::placeholder { color: var(--text-tertiary); }
  input[type=text]:focus, select:focus, textarea:focus {
    border-color: rgba(184, 91, 112, 0.72);
    box-shadow: 0 0 0 4px rgba(184, 91, 112, 0.12);
  }
  select { cursor: pointer; }
  textarea {
    min-height: 86px;
    width: 100%;
    resize: vertical;
  }

  .btn-primary, .btn-outline, .btn-danger {
    min-height: 42px;
    padding: 0 15px;
    border-radius: var(--radius-md);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    border: 1px solid transparent;
    cursor: pointer;
    font-size: 14px;
    font-weight: 750;
    line-height: 1;
    white-space: nowrap;
    transition: transform 0.16s ease, box-shadow 0.16s ease, background 0.16s ease, border-color 0.16s ease;
  }

  .btn-primary {
    color: #fffaf8;
    background: linear-gradient(135deg, var(--accent), var(--accent-strong));
    box-shadow: 0 10px 24px rgba(141, 49, 76, 0.24);
  }
  .btn-outline {
    color: var(--text);
    border-color: var(--line-strong);
    background: rgba(255, 253, 251, 0.72);
  }
  .btn-danger {
    color: var(--red);
    border-color: rgba(179, 61, 68, 0.42);
    background: var(--red-soft);
  }
  .btn-sm {
    min-height: 38px;
    padding-inline: 13px;
    font-size: 13px;
  }
  .btn-primary:hover, .btn-outline:hover, .btn-danger:hover {
    transform: translateY(-1px);
    box-shadow: 0 12px 26px rgba(83, 47, 45, 0.13);
  }
  .btn-outline:hover { background: var(--surface); border-color: rgba(184, 91, 112, 0.34); }
  .btn-primary:active, .btn-outline:active, .btn-danger:active { transform: translateY(0); }

  .projects-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(238px, 1fr));
    gap: 14px;
  }

  .project-card {
    min-height: 320px;
    border-radius: var(--radius-lg);
    overflow: hidden;
    cursor: pointer;
    border: 1px solid var(--line);
    background: var(--surface);
    box-shadow: 0 10px 28px rgba(83, 47, 45, 0.08);
    transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
  }

  .project-card:hover, .project-card:focus-visible {
    transform: translateY(-3px);
    border-color: rgba(184, 91, 112, 0.38);
    box-shadow: 0 18px 42px rgba(83, 47, 45, 0.14);
    outline: none;
  }

  .project-card .img-area {
    height: 164px;
    display: grid;
    place-items: center;
    position: relative;
    overflow: hidden;
    background:
      linear-gradient(135deg, rgba(184, 91, 112, 0.12), rgba(38, 122, 107, 0.1)),
      repeating-linear-gradient(45deg, rgba(255, 255, 255, 0.54) 0 2px, transparent 2px 12px),
      var(--surface-muted);
  }

  .project-card .img-area img,
  .detail-img img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .project-card .img-area .no-img {
    width: 58px;
    height: 58px;
    border-radius: 18px;
    display: grid;
    place-items: center;
    color: var(--accent-strong);
    font-size: 34px;
    background: rgba(255, 253, 251, 0.72);
    border: 1px solid rgba(255, 255, 255, 0.74);
  }

  .project-card .card-body {
    min-height: 154px;
    padding: 14px;
    display: flex;
    flex-direction: column;
  }
  .project-card .card-title {
    color: var(--text);
    font-size: 16px;
    font-weight: 800;
    line-height: 1.25;
  }
  .project-card .card-meta {
    margin-top: 7px;
    color: var(--text-secondary);
    font-size: 13px;
    line-height: 1.45;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card-footer {
    margin-top: auto;
    padding-top: 14px;
  }

  .yarn-pills {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .yarn-pill {
    max-width: 100%;
    padding: 4px 9px;
    border-radius: 999px;
    border: 1px solid rgba(82, 45, 48, 0.1);
    display: inline-flex;
    align-items: center;
    gap: 5px;
    color: var(--text);
    font-size: 11px;
    font-weight: 800;
    line-height: 1.2;
  }

  .status-badge {
    width: fit-content;
    padding: 5px 10px;
    border-radius: 999px;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    font-weight: 850;
    line-height: 1;
  }
  .status-badge.abs {
    position: absolute;
    top: 10px;
    right: 10px;
    box-shadow: 0 8px 20px rgba(83, 47, 45, 0.14);
  }
  .status-planejado { background: var(--blue-soft); color: var(--blue); }
  .status-em-andamento { background: var(--gold-soft); color: var(--gold); }
  .status-concluido { background: var(--green-soft); color: var(--green); }

  .yarns-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 12px;
  }

  .yarn-card {
    min-height: 116px;
    padding: 14px;
    display: flex;
    align-items: flex-start;
    gap: 13px;
    border-radius: var(--radius-lg);
    border: 1px solid var(--line);
    background: var(--surface);
    box-shadow: 0 10px 26px rgba(83, 47, 45, 0.07);
    cursor: pointer;
    transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
  }

  .yarn-card:hover, .yarn-card:focus-visible {
    transform: translateY(-2px);
    border-color: rgba(38, 122, 107, 0.36);
    box-shadow: 0 16px 36px rgba(83, 47, 45, 0.13);
    outline: none;
  }

  .yarn-swatch {
    width: 48px;
    height: 48px;
    border-radius: 16px;
    border: 1px solid rgba(82, 45, 48, 0.14);
    flex: 0 0 auto;
    box-shadow: inset 0 0 0 7px rgba(255, 255, 255, 0.24);
  }
  .yarn-name {
    color: var(--text);
    font-size: 15px;
    font-weight: 850;
    line-height: 1.25;
  }
  .yarn-detail {
    margin-top: 4px;
    color: var(--text-secondary);
    font-size: 13px;
  }
  .yarn-stock {
    margin-top: 10px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--mint);
    font-size: 12px;
    font-weight: 800;
  }

  .modal-overlay {
    position: fixed;
    inset: 0;
    z-index: 200;
    padding: 42px 16px;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    overflow-y: auto;
    background: rgba(38, 23, 25, 0.52);
    backdrop-filter: blur(8px);
  }

  .modal {
    width: min(100%, 560px);
    position: relative;
    overflow: hidden;
    border-radius: var(--radius-lg);
    border: 1px solid rgba(255, 255, 255, 0.68);
    background: var(--surface);
    box-shadow: 0 28px 80px rgba(38, 23, 25, 0.26);
  }

  .modal-header {
    padding: 16px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    border-bottom: 1px solid var(--line);
    background: var(--surface-soft);
  }

  .modal-header h2 {
    color: var(--text);
    font-size: 18px;
    font-weight: 850;
    line-height: 1.2;
  }

  .modal-close {
    width: 36px;
    height: 36px;
    border: 0;
    border-radius: 50%;
    display: grid;
    place-items: center;
    color: var(--text-secondary);
    background: rgba(255, 255, 255, 0.76);
    cursor: pointer;
  }

  .modal-body {
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .modal-footer {
    padding: 14px 18px 18px;
    border-top: 1px solid var(--line);
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    flex-wrap: wrap;
  }

  .field label {
    margin-bottom: 6px;
    display: block;
    color: var(--text-secondary);
    font-size: 13px;
    font-weight: 750;
  }
  .field input[type=text] { width: 100%; }
  .field input[type=color] {
    width: 100%;
    height: 42px;
    padding: 3px;
    cursor: pointer;
  }

  .form-row {
    display: grid;
    grid-template-columns: minmax(120px, 1fr) minmax(180px, 2fr);
    gap: 12px;
    align-items: end;
  }

  .img-upload-area {
    height: 142px;
    position: relative;
    overflow: hidden;
    border: 1px dashed rgba(184, 91, 112, 0.44);
    border-radius: var(--radius-md);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 7px;
    color: var(--text-tertiary);
    background:
      repeating-linear-gradient(135deg, rgba(184, 91, 112, 0.08) 0 1px, transparent 1px 12px),
      var(--surface-soft);
    cursor: pointer;
    transition: border-color 0.16s ease, background 0.16s ease;
  }

  .img-upload-area:hover {
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .img-upload-area input[type=file] {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    cursor: pointer;
  }
  .img-upload-area .up-text {
    color: var(--text-secondary);
    font-size: 13px;
    font-weight: 750;
    pointer-events: none;
  }
  .img-upload-area i { pointer-events: none; }
  .img-upload-area img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .yarn-checklist {
    max-height: 198px;
    overflow-y: auto;
    padding: 6px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    background: var(--surface-soft);
  }

  .yarn-check-item {
    min-height: 38px;
    padding: 7px 9px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-radius: var(--radius-sm);
    color: var(--text);
    cursor: pointer;
    transition: background 0.14s ease;
  }
  .yarn-check-item:hover { background: rgba(255, 255, 255, 0.76); }
  .yarn-check-item input[type=checkbox] {
    width: 16px;
    height: 16px;
    cursor: pointer;
    accent-color: var(--accent-strong);
  }
  .swatch-sm {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    border: 1px solid rgba(82, 45, 48, 0.16);
    flex: 0 0 auto;
  }
  .yarn-check-item span { font-size: 13px; }

  .detail-img {
    width: 100%;
    height: 250px;
    border-radius: var(--radius-md);
    display: grid;
    place-items: center;
    overflow: hidden;
    color: var(--text-tertiary);
    background:
      linear-gradient(135deg, rgba(184, 91, 112, 0.12), rgba(38, 122, 107, 0.1)),
      var(--surface-muted);
  }

  .detail-label {
    margin-bottom: 6px;
    display: block;
    color: var(--text-tertiary);
    font-size: 11px;
    font-weight: 850;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .yarn-detail-head {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .yarn-detail-swatch {
    width: 64px;
    height: 64px;
    border-radius: 18px;
    border: 1px solid var(--line-strong);
    flex: 0 0 auto;
    box-shadow: inset 0 0 0 8px rgba(255, 255, 255, 0.22);
  }

  .detail-title {
    color: var(--text);
    font-size: 17px;
    font-weight: 850;
    line-height: 1.2;
  }

  .detail-muted {
    margin-top: 3px;
    color: var(--text-secondary);
    font-size: 13px;
  }

  .empty-state {
    grid-column: 1/-1;
    min-height: 260px;
    padding: 40px 18px;
    border: 1px dashed var(--line-strong);
    border-radius: var(--radius-lg);
    display: grid;
    place-items: center;
    text-align: center;
    color: var(--text-tertiary);
    background: rgba(255, 253, 251, 0.52);
  }
  .empty-state i {
    margin-bottom: 12px;
    display: block;
    color: var(--accent);
    font-size: 42px;
  }
  .empty-state p {
    color: var(--text-secondary);
    font-size: 14px;
    font-weight: 750;
  }

  .used-in-item {
    min-height: 38px;
    padding: 8px 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    border-bottom: 1px solid var(--line);
    color: var(--text);
    font-size: 13px;
    font-weight: 700;
  }
  .used-in-item:last-child { border-bottom: 0; }

  @media (max-width: 760px) {
    .container {
      width: min(100% - 20px, 1120px);
      padding-top: 10px;
    }
    .header {
      align-items: flex-start;
      padding: 18px;
      flex-direction: column;
    }
    .brand-panel { align-items: flex-start; }
    .brand-icon {
      width: 54px;
      height: 54px;
      border-radius: 15px;
    }
    .brand-icon i { font-size: 28px; }
    .header-actions { width: 100%; justify-content: stretch; }
    .header-actions .btn-primary,
    .header-actions .btn-outline { flex: 1; }
    .storage-status { width: 100%; justify-content: center; order: 3; }
    .summary-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .workspace-panel { padding: 12px; }
    .tabs { width: 100%; display: grid; grid-template-columns: 1fr 1fr; }
    .tab { justify-content: center; padding: 0 8px; }
    .toolbar { align-items: stretch; }
    .toolbar > * { width: 100%; }
    .search-box { min-width: 100%; }
    .projects-grid, .yarns-grid { grid-template-columns: 1fr; }
    .form-row { grid-template-columns: 1fr; }
    .modal-overlay { padding: 16px 10px; }
    .modal-footer button { flex: 1; }
  }

  @media (max-width: 440px) {
    .summary-grid { grid-template-columns: 1fr; }
    .brand-panel { gap: 12px; }
    .header h1 { font-size: 32px; }
    .header p { font-size: 14px; }
  }
</style>
</head>
<body>
<div class="container">
  <header class="header">
    <div class="brand-panel">
      <div class="brand-icon" aria-hidden="true"><i class="ti ti-needle-thread"></i></div>
      <div>
        <p class="eyebrow">Organizador de crochê</p>
        <h1>Armarinho Virtual</h1>
        <p>Projetos, linhas, fotos e anotações em um cantinho só.</p>
      </div>
    </div>
    <div class="header-actions">
      <span class="storage-status" id="storage-status"><i class="ti ti-cloud-check"></i> Salvando neste dispositivo</span>
      <label class="btn-outline btn-sm">
        <i class="ti ti-upload"></i> Importar
        <input type="file" accept=".json" style="display:none" onchange="importData(this.files[0])">
      </label>
      <button class="btn-primary btn-sm" onclick="exportData()">
        <i class="ti ti-download"></i> Exportar
      </button>
    </div>
  </header>

  <section class="summary-grid" aria-label="Resumo do armarinho">
    <div class="summary-card">
      <span><i class="ti ti-folder-heart"></i> Projetos</span>
      <strong id="stat-projects">0</strong>
      <small>Total cadastrado</small>
    </div>
    <div class="summary-card">
      <span><i class="ti ti-hourglass-high"></i> Em andamento</span>
      <strong id="stat-active">0</strong>
      <small>Na agulha agora</small>
    </div>
    <div class="summary-card">
      <span><i class="ti ti-checks"></i> Concluídos</span>
      <strong id="stat-finished">0</strong>
      <small>Prontos para lembrar</small>
    </div>
    <div class="summary-card">
      <span><i class="ti ti-palette"></i> Linhas</span>
      <strong id="stat-yarns">0</strong>
      <small>Cores no estoque</small>
    </div>
  </section>

  <main class="workspace-panel">
    <div class="tabs" role="tablist" aria-label="Seções do armarinho">
      <button class="tab active" role="tab" aria-selected="true" onclick="showTab('projetos')"><i class="ti ti-needle-thread"></i> Projetos</button>
      <button class="tab" role="tab" aria-selected="false" onclick="showTab('linhas')"><i class="ti ti-ball-football"></i> Minhas linhas</button>
    </div>

  <div id="tab-projetos">
    <div class="toolbar">
      <label class="search-box" aria-label="Buscar projetos">
        <i class="ti ti-search"></i>
        <input type="text" id="search-proj" placeholder="Buscar projetos..." oninput="renderProjects()" />
      </label>
      <select id="filter-status" onchange="renderProjects()">
        <option value="">Todos os status</option>
        <option value="planejado">Planejado</option>
        <option value="em-andamento">Em andamento</option>
        <option value="concluido">Concluído</option>
      </select>
      <button class="btn-primary" onclick="openNewProject()"><i class="ti ti-plus"></i> Novo projeto</button>
    </div>
    <div class="projects-grid" id="projects-grid"></div>
  </div>

  <div id="tab-linhas" style="display:none">
    <div class="toolbar">
      <label class="search-box" aria-label="Buscar linhas">
        <i class="ti ti-search"></i>
        <input type="text" id="search-yarn" placeholder="Buscar linhas..." oninput="renderYarns()" />
      </label>
      <button class="btn-primary" onclick="openNewYarn()"><i class="ti ti-plus"></i> Nova linha</button>
    </div>
    <div class="yarns-grid" id="yarns-grid"></div>
  </div>
  </main>
</div>

<div id="modal-container"></div>

<script>
const defaultState = {
  projects: [
    { id: 1, name: 'Amigurumi coelhinho', status: 'em-andamento', notes: 'Presente de aniversário. Tamanho médio.', yarns: [1,2], img: null },
    { id: 2, name: 'Bolsa de mercado', status: 'planejado', notes: 'Linha resistente, malha mais aberta.', yarns: [3], img: null },
    { id: 3, name: 'Cachecol de inverno', status: 'concluido', notes: 'Ponto rendado. Ficou lindo!', yarns: [2,4], img: null },
  ],
  yarns: [
    { id: 1, name: 'Cisne 100% algodão', color: '#F4A261', weight: 'Fino (DK)', stock: '3 novelos', notes: '' },
    { id: 2, name: 'Fio Cru natural', color: '#E9C46A', weight: 'Médio (Worsted)', stock: '5 novelos', notes: '' },
    { id: 3, name: 'Barbante 6 verde', color: '#2A9D8F', weight: 'Grosso (Bulky)', stock: '2 rolos', notes: '' },
    { id: 4, name: 'Linha azul petróleo', color: '#264653', weight: 'Fino (DK)', stock: '1 novelo', notes: '' },
  ],
  nextProjId: 4,
  nextYarnId: 5
};

const STORAGE_KEY = 'armarinho_v1';
const DB_NAME = 'armarinho_virtual_db';
const DB_VERSION = 1;
const DB_STORE = 'app_state';

function copyDefaultState() {
  return JSON.parse(JSON.stringify(defaultState));
}

function normalizeState(data) {
  const source = data && typeof data === 'object' ? data : {};
  const projects = Array.isArray(source.projects) ? source.projects : [];
  const yarns = Array.isArray(source.yarns) ? source.yarns : [];
  const projectIds = projects.map(p => Number(p.id)).filter(Number.isFinite);
  const yarnIds = yarns.map(y => Number(y.id)).filter(Number.isFinite);
  const validStatuses = ['planejado', 'em-andamento', 'concluido'];
  return {
    projects: projects.map(p => ({
      id: Number(p.id),
      name: String(p.name || 'Projeto sem nome'),
      status: validStatuses.includes(p.status) ? p.status : 'planejado',
      notes: String(p.notes || ''),
      yarns: Array.isArray(p.yarns) ? p.yarns.map(Number).filter(Number.isFinite) : [],
      img: typeof p.img === 'string' && p.img ? p.img : null
    })).filter(p => Number.isFinite(p.id)),
    yarns: yarns.map(y => ({
      id: Number(y.id),
      name: String(y.name || 'Linha sem nome'),
      color: /^#[0-9a-f]{6}$/i.test(y.color || '') ? y.color : '#b85b70',
      weight: String(y.weight || 'Não informado'),
      stock: String(y.stock || ''),
      notes: String(y.notes || '')
    })).filter(y => Number.isFinite(y.id)),
    nextProjId: Math.max(Number(source.nextProjId) || 0, 0, ...projectIds) + (Number(source.nextProjId) > Math.max(0, ...projectIds) ? 0 : 1),
    nextYarnId: Math.max(Number(source.nextYarnId) || 0, 0, ...yarnIds) + (Number(source.nextYarnId) > Math.max(0, ...yarnIds) ? 0 : 1)
  };
}

function loadState() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) return normalizeState(JSON.parse(saved));
  } catch(e) {}
  return copyDefaultState();
}

function setStorageStatus(message, fallback = false) {
  const element = document.getElementById('storage-status');
  if (!element) return;
  element.classList.toggle('is-fallback', fallback);
  element.innerHTML = `<i class="ti ${fallback ? 'ti-device-floppy' : 'ti-cloud-check'}"></i> ${message}`;
}

function openStateDb() {
  return new Promise((resolve, reject) => {
    if (!('indexedDB' in window)) { reject(new Error('IndexedDB indisponível')); return; }
    const request = indexedDB.open(DB_NAME, DB_VERSION);
    request.onupgradeneeded = () => {
      if (!request.result.objectStoreNames.contains(DB_STORE)) request.result.createObjectStore(DB_STORE, { keyPath: 'id' });
    };
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error || new Error('Não foi possível abrir o armazenamento'));
  });
}

function readDbState(db) {
  return new Promise((resolve, reject) => {
    const request = db.transaction(DB_STORE, 'readonly').objectStore(DB_STORE).get('current');
    request.onsuccess = () => resolve(request.result ? request.result.state : null);
    request.onerror = () => reject(request.error);
  });
}

function writeDbState(db, snapshot) {
  return new Promise((resolve, reject) => {
    const request = db.transaction(DB_STORE, 'readwrite').objectStore(DB_STORE).put({ id: 'current', state: snapshot, savedAt: Date.now() });
    request.onsuccess = () => resolve();
    request.onerror = () => reject(request.error);
  });
}

let stateDb = null;
let saveQueue = Promise.resolve();

function saveState() {
  const snapshot = normalizeState(state);
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(snapshot));
  } catch(e) {
    setStorageStatus('Cópia local indisponível', true);
  }
  if (!stateDb) return saveQueue;
  saveQueue = saveQueue.then(() => writeDbState(stateDb, snapshot)).then(() => {
    setStorageStatus('Salvo neste dispositivo');
  }).catch(() => {
    setStorageStatus('Salvando em modo local', true);
  });
  return saveQueue;
}

async function hydrateState() {
  try {
    stateDb = await openStateDb();
    const stored = await readDbState(stateDb);
    if (stored && Array.isArray(stored.projects) && Array.isArray(stored.yarns)) {
      Object.assign(state, normalizeState(stored));
    } else {
      await writeDbState(stateDb, normalizeState(state));
    }
    setStorageStatus('Salvo neste dispositivo');
    renderProjects();
    if (document.getElementById('tab-linhas').style.display !== 'none') renderYarns();
  } catch (error) {
    stateDb = null;
    setStorageStatus('Salvando em modo local', true);
  }
}

function exportData() {
  const json = JSON.stringify(state, null, 2);
  const blob = new Blob([json], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'armarinho_virtual.json';
  a.click();
  URL.revokeObjectURL(url);
}

function importData(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      if (!Array.isArray(data.projects) || !Array.isArray(data.yarns)) { alert('Arquivo inválido.'); return; }
      Object.assign(state, normalizeState(data));
      closeModal();
      renderProjects();
      saveState().then(() => alert('Dados importados e salvos com sucesso!'));
    } catch(err) {
      alert('Erro ao importar: arquivo inválido.');
    }
  };
  reader.readAsText(file);
}

const state = loadState();

const statusLabel = { 'planejado': 'Planejado', 'em-andamento': 'Em andamento', 'concluido': 'Concluído' };
const statusIcon = { 'planejado': 'ti-calendar-time', 'em-andamento': 'ti-hourglass-high', 'concluido': 'ti-check' };
const escapeMap = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };

function escapeHtml(value = '') {
  return String(value).replace(/[&<>"']/g, char => escapeMap[char]);
}

function safeColor(value) {
  return /^#[0-9a-f]{6}$/i.test(value || '') ? value : '#b85b70';
}

function statusBadge(status, extraClass = '') {
  const safeStatus = statusLabel[status] ? status : 'planejado';
  return `<span class="status-badge ${extraClass} status-${safeStatus}"><i class="ti ${statusIcon[safeStatus]}"></i>${statusLabel[safeStatus]}</span>`;
}

function yarnPill(yarn) {
  const color = safeColor(yarn.color);
  return `<span class="yarn-pill" style="background:${color}24;border-color:${color}44"><span class="swatch-sm" style="width:10px;height:10px;background:${color}"></span>${escapeHtml(yarn.name)}</span>`;
}

function updateStats() {
  document.getElementById('stat-projects').textContent = state.projects.length;
  document.getElementById('stat-active').textContent = state.projects.filter(p => p.status === 'em-andamento').length;
  document.getElementById('stat-finished').textContent = state.projects.filter(p => p.status === 'concluido').length;
  document.getElementById('stat-yarns').textContent = state.yarns.length;
}

function handleCardKey(event, type, id) {
  if (event.key !== 'Enter' && event.key !== ' ') return;
  event.preventDefault();
  if (type === 'project') openProject(id);
  if (type === 'yarn') openYarn(id);
}

function showTab(tab) {
  document.querySelectorAll('.tab').forEach((t, i) => {
    const active = ['projetos','linhas'][i] === tab;
    t.classList.toggle('active', active);
    t.setAttribute('aria-selected', active ? 'true' : 'false');
  });
  document.getElementById('tab-projetos').style.display = tab === 'projetos' ? '' : 'none';
  document.getElementById('tab-linhas').style.display = tab === 'linhas' ? '' : 'none';
  if (tab === 'linhas') renderYarns();
}

function renderProjects() {
  updateStats();
  const q = (document.getElementById('search-proj').value || '').toLowerCase();
  const st = document.getElementById('filter-status').value;
  const grid = document.getElementById('projects-grid');
  const filtered = state.projects.filter(p => (p.name || '').toLowerCase().includes(q) && (!st || p.status === st));
  if (!filtered.length) {
    grid.innerHTML = '<div class="empty-state"><div><i class="ti ti-folder-search"></i><p>Nenhum projeto encontrado</p></div></div>';
    return;
  }
  grid.innerHTML = filtered.map(p => {
    const projectId = Number(p.id);
    if (!Number.isFinite(projectId)) return '';
    const yarnObjs = (p.yarns || []).map(id => state.yarns.find(y => y.id === id)).filter(Boolean);
    const pills = yarnObjs.slice(0, 3).map(yarnPill).join('');
    const morePills = yarnObjs.length > 3 ? `<span class="yarn-pill">+${yarnObjs.length - 3}</span>` : '';
    const imgEl = p.img ? `<img src="${escapeHtml(p.img)}" alt="${escapeHtml(p.name)}">` : `<i class="ti ti-needle-thread no-img"></i>`;
    const notes = (p.notes || '').trim();
    return `<div class="project-card" role="button" tabindex="0" onclick="openProject(${projectId})" onkeydown="handleCardKey(event,'project',${projectId})">
      <div class="img-area">${imgEl}${statusBadge(p.status, 'abs')}</div>
      <div class="card-body">
        <div class="card-title">${escapeHtml(p.name)}</div>
        ${notes ? `<div class="card-meta">${escapeHtml(notes)}</div>` : '<div class="card-meta">Sem notas por enquanto.</div>'}
        <div class="card-footer"><div class="yarn-pills">${pills}${morePills || (pills ? '' : '<span class="yarn-pill">Sem linha</span>')}</div></div>
      </div>
    </div>`;
  }).join('');
}

function renderYarns() {
  updateStats();
  const q = (document.getElementById('search-yarn').value || '').toLowerCase();
  const grid = document.getElementById('yarns-grid');
  const filtered = state.yarns.filter(y => (y.name || '').toLowerCase().includes(q));
  if (!filtered.length) {
    grid.innerHTML = '<div class="empty-state"><div><i class="ti ti-palette-off"></i><p>Nenhuma linha encontrada</p></div></div>';
    return;
  }
  grid.innerHTML = filtered.map(y => {
    const yarnId = Number(y.id);
    if (!Number.isFinite(yarnId)) return '';
    const used = state.projects.filter(p => (p.yarns || []).includes(y.id)).length;
    const color = safeColor(y.color);
    return `<div class="yarn-card" role="button" tabindex="0" onclick="openYarn(${yarnId})" onkeydown="handleCardKey(event,'yarn',${yarnId})">
      <div class="yarn-swatch" style="background:${color}"></div>
      <div>
        <div class="yarn-name">${escapeHtml(y.name)}</div>
        <div class="yarn-detail">${escapeHtml(y.weight)}</div>
        <div class="yarn-stock"><i class="ti ti-package"></i>${escapeHtml(y.stock || 'Sem estoque')} · ${used} projeto${used !== 1 ? 's' : ''}</div>
      </div>
    </div>`;
  }).join('');
}

function closeModal() { document.getElementById('modal-container').innerHTML = ''; }

function yarnChecklist(selectedIds) {
  if (!state.yarns.length) return '<p style="font-size:13px;color:var(--text-secondary)">Nenhuma linha cadastrada ainda. Adicione linhas na aba "Minhas linhas".</p>';
  const selected = (selectedIds || []).map(Number);
  return state.yarns.map(y => {
    const yarnId = Number(y.id);
    if (!Number.isFinite(yarnId)) return '';
    const color = safeColor(y.color);
    return `
    <label class="yarn-check-item">
      <input type="checkbox" value="${yarnId}" ${selected.includes(yarnId) ? 'checked' : ''}>
      <span class="swatch-sm" style="background:${color}"></span>
      <span>${escapeHtml(y.name)} <span style="color:var(--text-secondary);font-size:12px">· ${escapeHtml(y.weight)}</span></span>
    </label>`;
  }).join('');
}

function getCheckedYarns(container) {
  return [...container.querySelectorAll('input[type=checkbox]:checked')].map(cb => parseInt(cb.value));
}

function previewImg(e, areaId, hiddenId) {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const area = document.getElementById(areaId);
    area.innerHTML = `<img src="${ev.target.result}" alt="preview"><input type="file" accept="image/*" onchange="previewImg(event,'${areaId}','${hiddenId}')">`;
    document.getElementById(hiddenId).value = ev.target.result;
  };
  reader.readAsDataURL(file);
}

function openNewProject() {
  document.getElementById('modal-container').innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <div class="modal-header"><h2>Novo projeto</h2><button class="modal-close" onclick="closeModal()"><i class="ti ti-x"></i></button></div>
        <div class="modal-body">
          <div class="field"><label>Foto do projeto</label>
            <div class="img-upload-area" id="upload-area">
              <input type="file" accept="image/*" onchange="previewImg(event,'upload-area','proj-img-data')">
              <i class="ti ti-photo-up" style="font-size:28px;color:var(--text-tertiary)"></i>
              <span class="up-text">Clique para adicionar foto</span>
            </div>
            <input type="hidden" id="proj-img-data">
          </div>
          <div class="field"><label>Nome do projeto</label><input type="text" id="proj-name" placeholder="Ex: Amigurumi urso"></div>
          <div class="field"><label>Status</label>
            <select id="proj-status" style="width:100%">
              <option value="planejado">Planejado</option>
              <option value="em-andamento">Em andamento</option>
              <option value="concluido">Concluído</option>
            </select>
          </div>
          <div class="field"><label>Notas</label><textarea id="proj-notes" placeholder="Pontos usados, tamanho, observações..."></textarea></div>
          <div class="field"><label>Linhas para este projeto</label>
            <div class="yarn-checklist" id="yarn-checklist">${yarnChecklist([])}</div>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn-outline" onclick="closeModal()">Cancelar</button>
          <button class="btn-primary" onclick="saveNewProject()"><i class="ti ti-check"></i> Salvar</button>
        </div>
      </div>
    </div>`;
}

function saveNewProject() {
  const name = document.getElementById('proj-name').value.trim();
  if (!name) { alert('Digite um nome para o projeto'); return; }
  const yarns = getCheckedYarns(document.getElementById('yarn-checklist'));
  state.projects.push({
    id: state.nextProjId++,
    name,
    status: document.getElementById('proj-status').value,
    notes: document.getElementById('proj-notes').value.trim(),
    yarns,
    img: document.getElementById('proj-img-data').value || null
  });
  saveState(); closeModal(); renderProjects();
}

function openProject(id) {
  const p = state.projects.find(x => x.id === id); if (!p) return;
  const yarnObjs = (p.yarns || []).map(yid => state.yarns.find(y => y.id === yid)).filter(Boolean);
  const pills = yarnObjs.map(yarnPill).join('');
  const imgEl = p.img
    ? `<div class="detail-img"><img src="${escapeHtml(p.img)}" alt="${escapeHtml(p.name)}"></div>`
    : `<div class="detail-img"><i class="ti ti-needle-thread" style="font-size:48px;color:var(--text-tertiary)"></i></div>`;
  document.getElementById('modal-container').innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <div class="modal-header"><h2>${escapeHtml(p.name)}</h2><button class="modal-close" onclick="closeModal()"><i class="ti ti-x"></i></button></div>
        <div class="modal-body">
          ${imgEl}
          <div><span class="detail-label">Status</span>${statusBadge(p.status)}</div>
          ${p.notes ? `<div><span class="detail-label">Notas</span><p style="font-size:14px;color:var(--text)">${escapeHtml(p.notes)}</p></div>` : ''}
          <div><span class="detail-label">Linhas</span>
            <div class="yarn-pills" style="margin-top:6px">
              ${pills || '<span style="font-size:13px;color:var(--text-tertiary)">Nenhuma linha associada</span>'}
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn-danger" onclick="deleteProject(${id})"><i class="ti ti-trash"></i> Excluir</button>
          <button class="btn-outline" onclick="closeModal()">Fechar</button>
          <button class="btn-primary" onclick="editProject(${id})"><i class="ti ti-edit"></i> Editar</button>
        </div>
      </div>
    </div>`;
}

function editProject(id) {
  const p = state.projects.find(x => x.id === id); if (!p) return;
  document.getElementById('modal-container').innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <div class="modal-header"><h2>Editar projeto</h2><button class="modal-close" onclick="closeModal()"><i class="ti ti-x"></i></button></div>
        <div class="modal-body">
          <div class="field"><label>Foto do projeto</label>
            <div class="img-upload-area" id="upload-area-edit">
              ${p.img ? `<img src="${escapeHtml(p.img)}" alt="foto"><input type="file" accept="image/*" onchange="previewImg(event,'upload-area-edit','proj-img-edit')">` : `<input type="file" accept="image/*" onchange="previewImg(event,'upload-area-edit','proj-img-edit')"><i class="ti ti-photo-up" style="font-size:28px;color:var(--text-tertiary)"></i><span class="up-text">Clique para trocar a foto</span>`}
            </div>
            <input type="hidden" id="proj-img-edit" value="${escapeHtml(p.img || '')}">
          </div>
          <div class="field"><label>Nome</label><input type="text" id="edit-name" value="${escapeHtml(p.name)}"></div>
          <div class="field"><label>Status</label>
            <select id="edit-status" style="width:100%">
              <option value="planejado" ${p.status==='planejado'?'selected':''}>Planejado</option>
              <option value="em-andamento" ${p.status==='em-andamento'?'selected':''}>Em andamento</option>
              <option value="concluido" ${p.status==='concluido'?'selected':''}>Concluído</option>
            </select>
          </div>
          <div class="field"><label>Notas</label><textarea id="edit-notes">${escapeHtml(p.notes)}</textarea></div>
          <div class="field"><label>Linhas</label>
            <div class="yarn-checklist" id="yarn-checklist-edit">${yarnChecklist(p.yarns || [])}</div>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn-outline" onclick="openProject(${id})">Cancelar</button>
          <button class="btn-primary" onclick="saveEditProject(${id})"><i class="ti ti-check"></i> Salvar</button>
        </div>
      </div>
    </div>`;
}

function saveEditProject(id) {
  const p = state.projects.find(x => x.id === id); if (!p) return;
  const name = document.getElementById('edit-name').value.trim();
  if (name) p.name = name;
  p.status = document.getElementById('edit-status').value;
  p.notes = document.getElementById('edit-notes').value.trim();
  p.yarns = getCheckedYarns(document.getElementById('yarn-checklist-edit'));
  const newImg = document.getElementById('proj-img-edit').value;
  if (newImg) p.img = newImg;
  saveState(); closeModal(); renderProjects();
}

function deleteProject(id) {
  if (!confirm('Excluir este projeto?')) return;
  state.projects = state.projects.filter(p => p.id !== id);
  saveState(); closeModal(); renderProjects();
}

function openNewYarn() {
  document.getElementById('modal-container').innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <div class="modal-header"><h2>Nova linha</h2><button class="modal-close" onclick="closeModal()"><i class="ti ti-x"></i></button></div>
        <div class="modal-body">
          <div class="field"><label>Nome da linha</label><input type="text" id="yarn-name" placeholder="Ex: Barbante 4 colorido"></div>
          <div class="form-row">
            <div class="field"><label>Cor</label><input type="color" id="yarn-color" value="#E9C46A"></div>
            <div class="field"><label>Espessura</label>
              <select id="yarn-weight" style="width:100%">
                <option>Fino (DK)</option>
                <option>Médio (Worsted)</option>
                <option>Grosso (Bulky)</option>
                <option>Super grosso</option>
                <option>Linha de bordado</option>
              </select>
            </div>
          </div>
          <div class="field"><label>Estoque</label><input type="text" id="yarn-stock" placeholder="Ex: 4 novelos"></div>
          <div class="field"><label>Notas</label><textarea id="yarn-notes" placeholder="Marca, composição, agulha recomendada..."></textarea></div>
        </div>
        <div class="modal-footer">
          <button class="btn-outline" onclick="closeModal()">Cancelar</button>
          <button class="btn-primary" onclick="saveNewYarn()"><i class="ti ti-check"></i> Salvar</button>
        </div>
      </div>
    </div>`;
}

function saveNewYarn() {
  const name = document.getElementById('yarn-name').value.trim();
  if (!name) { alert('Digite um nome para a linha'); return; }
  state.yarns.push({
    id: state.nextYarnId++,
    name,
    color: document.getElementById('yarn-color').value,
    weight: document.getElementById('yarn-weight').value,
    stock: document.getElementById('yarn-stock').value.trim(),
    notes: document.getElementById('yarn-notes').value.trim()
  });
  saveState(); closeModal(); renderYarns();
}

function openYarn(id) {
  const y = state.yarns.find(x => x.id === id); if (!y) return;
  const projs = state.projects.filter(p => (p.yarns || []).includes(id));
  const color = safeColor(y.color);
  document.getElementById('modal-container').innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <div class="modal-header"><h2>${escapeHtml(y.name)}</h2><button class="modal-close" onclick="closeModal()"><i class="ti ti-x"></i></button></div>
        <div class="modal-body">
          <div class="yarn-detail-head">
            <div class="yarn-detail-swatch" style="background:${color}"></div>
            <div>
              <p class="detail-title">${escapeHtml(y.name)}</p>
              <p class="detail-muted">${escapeHtml(y.weight)}</p>
              <p class="detail-muted">${escapeHtml(y.stock || 'Sem estoque')}</p>
            </div>
          </div>
          ${y.notes ? `<div><span class="detail-label">Notas</span><p style="font-size:14px;color:var(--text)">${escapeHtml(y.notes)}</p></div>` : ''}
          <div>
            <span class="detail-label">Usada em ${projs.length} projeto${projs.length!==1?'s':''}</span>
            ${projs.length
              ? `<div style="margin-top:6px">${projs.map(p=>`<div class="used-in-item">${escapeHtml(p.name)}${statusBadge(p.status)}</div>`).join('')}</div>`
              : '<p style="font-size:13px;color:var(--text-tertiary)">Nenhum projeto usa esta linha ainda</p>'}
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn-danger" onclick="deleteYarn(${id})"><i class="ti ti-trash"></i> Excluir</button>
          <button class="btn-outline" onclick="closeModal()">Fechar</button>
          <button class="btn-primary" onclick="editYarn(${id})"><i class="ti ti-edit"></i> Editar</button>
        </div>
      </div>
    </div>`;
}

function editYarn(id) {
  const y = state.yarns.find(x => x.id === id); if (!y) return;
  const color = safeColor(y.color);
  document.getElementById('modal-container').innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <div class="modal-header"><h2>Editar linha</h2><button class="modal-close" onclick="closeModal()"><i class="ti ti-x"></i></button></div>
        <div class="modal-body">
          <div class="field"><label>Nome</label><input type="text" id="edit-yarn-name" value="${escapeHtml(y.name)}"></div>
          <div class="form-row">
            <div class="field"><label>Cor</label><input type="color" id="edit-yarn-color" value="${color}"></div>
            <div class="field"><label>Espessura</label>
              <select id="edit-yarn-weight" style="width:100%">
                ${['Fino (DK)','Médio (Worsted)','Grosso (Bulky)','Super grosso','Linha de bordado'].map(w=>`<option ${y.weight===w?'selected':''}>${escapeHtml(w)}</option>`).join('')}
              </select>
            </div>
          </div>
          <div class="field"><label>Estoque</label><input type="text" id="edit-yarn-stock" value="${escapeHtml(y.stock)}"></div>
          <div class="field"><label>Notas</label><textarea id="edit-yarn-notes">${escapeHtml(y.notes)}</textarea></div>
        </div>
        <div class="modal-footer">
          <button class="btn-outline" onclick="openYarn(${id})">Cancelar</button>
          <button class="btn-primary" onclick="saveEditYarn(${id})"><i class="ti ti-check"></i> Salvar</button>
        </div>
      </div>
    </div>`;
}

function saveEditYarn(id) {
  const y = state.yarns.find(x => x.id === id); if (!y) return;
  const name = document.getElementById('edit-yarn-name').value.trim();
  if (name) y.name = name;
  y.color = document.getElementById('edit-yarn-color').value;
  y.weight = document.getElementById('edit-yarn-weight').value;
  y.stock = document.getElementById('edit-yarn-stock').value.trim();
  y.notes = document.getElementById('edit-yarn-notes').value.trim();
  saveState(); closeModal(); renderYarns();
}

function deleteYarn(id) {
  if (!confirm('Excluir esta linha? Ela será removida dos projetos associados.')) return;
  state.yarns = state.yarns.filter(y => y.id !== id);
  state.projects.forEach(p => { p.yarns = (p.yarns || []).filter(yid => yid !== id); });
  saveState(); closeModal(); renderYarns();
}

renderProjects();
hydrateState();
</script>
</body>
</html>
